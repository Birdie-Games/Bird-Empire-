<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bird Empires">
<meta name="theme-color" content="#0d1417">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
</head>
<body>
<title>Bird Empires</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: full-bleed 3D canvas; HUD floats above it in safe-area-aware layers. Heraldic brass on deep slate glass. */
:root{
  --ink:#0d1417; --glass:rgba(15,24,28,.88); --glass2:rgba(24,37,43,.94); --well:rgba(255,255,255,.05);
  --line:rgba(212,169,79,.28); --line2:rgba(255,255,255,.09);
  --text:#ece8dd; --muted:#9fb1ae; --brass:#d4a94f; --brass-hi:#f3d791; --war:#e0614f; --peace:#7cc289; --sky:#8fc6dc;
  --display:'Alegreya SC','Palatino Linotype',Georgia,serif; --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{color:var(--text);font-family:var(--body);font-size:15px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.screen{position:fixed;inset:0;pointer-events:none;z-index:5}
.screen>*{pointer-events:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;background:var(--well);border:1px solid var(--line2);font-weight:700;letter-spacing:.02em}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(#e2bb63,#b98a32);color:#1d1406;border-color:#f3d791}
.btn.danger{background:rgba(224,97,79,.16);border-color:rgba(224,97,79,.55);color:#ffb4a8}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.38;pointer-events:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- title ---------- */
#title{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,rgba(13,20,23,.96) 0%,rgba(13,20,23,.75) 32%,rgba(13,20,23,0) 58%);pointer-events:auto}
#title .emblem{width:clamp(180px,46vw,300px);max-width:100%;height:auto;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6));animation:crest 1s cubic-bezier(.2,.9,.3,1.2) both;margin-bottom:4px}
@keyframes crest{from{transform:translateY(24px) scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){#title .emblem{animation:none}}
#title .logo{font-family:var(--display);font-weight:800;font-size:clamp(46px,13vw,92px);line-height:.92;letter-spacing:.01em;text-align:center;color:var(--brass-hi);text-shadow:0 2px 0 #6b4c14,0 10px 30px rgba(0,0,0,.6)}
#title .logo small{display:block;font-size:.26em;letter-spacing:.24em;color:var(--text);text-shadow:none;margin-bottom:6px;font-weight:500}
#title .tag{color:var(--muted);text-align:center;max-width:34ch;margin:10px 0 22px}
#title .stack{display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}

/* ---------- creator ---------- */
#creator{display:flex;flex-direction:column;justify-content:space-between}
.cr-head{padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.cr-head>*{pointer-events:auto}
.cr-head h2{font-size:26px}
.name-in{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;color:var(--text);font:600 17px var(--body);padding:8px 10px;width:min(320px,100%)}
.cr-panel{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:48vh}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--well);border:1px solid var(--line2);font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{background:rgba(212,169,79,.18);border-color:var(--brass);color:var(--brass-hi)}
.cr-body{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px;padding:2px 2px 4px}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl label{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--brass);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:8px;background:var(--well);border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--text)}
.chip.on{border-color:var(--brass);background:rgba(212,169,79,.16);color:var(--brass-hi)}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
.sw button.on{border-color:var(--brass-hi);box-shadow:0 0 0 2px rgba(243,215,145,.35)}
.sw input[type=color]{width:34px;height:30px;border:0;padding:0;background:none}
.cr-foot{display:flex;gap:8px;flex:0 0 auto}
.cr-foot .btn{flex:1}

/* ---------- nation ---------- */
#nation{overflow-y:auto;background:linear-gradient(rgba(13,20,23,.55),rgba(13,20,23,.92) 40%);pointer-events:auto}
.nat-wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--glass2);border:1px solid var(--line2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:18px;color:var(--brass-hi)}
.flagbig{width:100%;max-width:300px;aspect-ratio:5/3;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.5);align-self:center;background:#222}
.field{display:flex;flex-direction:column;gap:5px}
.field span{font-size:13px;color:var(--muted);font-weight:700}
.field input{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:8px;color:var(--text);font:500 16px var(--body);padding:10px;width:100%;box-sizing:border-box}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}

/* ---------- HUD ---------- */
#hud{display:block}
.topbar{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 18px max(10px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(10,16,19,.92),rgba(10,16,19,.7) 60%,rgba(10,16,19,0));display:flex;align-items:center;gap:8px;pointer-events:none}
.topbar>*{pointer-events:auto}
.natbtn{display:flex;align-items:center;gap:7px;min-width:0;flex:0 1 auto}
.natbtn img{width:30px;height:18px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.natbtn b{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28vw}
@media (max-width:560px){.natbtn b{display:none}}
.res{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.res::-webkit-scrollbar{display:none}
.r{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:4px 7px;border-radius:8px;background:rgba(0,0,0,.32);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.r svg{width:15px;height:15px}
.r i{font-style:normal;font-size:11px;font-weight:600}
.r i.up{color:var(--peace)} .r i.dn{color:var(--war)}
.turn{flex:0 0 auto;font-family:var(--display);font-size:13px;color:var(--brass-hi);white-space:nowrap}
.rail{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 54px);display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.rb svg{width:21px;height:21px;color:var(--brass-hi)}
.rb .dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--war);border:2px solid var(--ink)}
.rb.on{background:rgba(212,169,79,.3)}
#minimap{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 54px);border-radius:8px;border:1px solid var(--line);box-shadow:0 3px 12px rgba(0,0,0,.5);background:#0b2633;touch-action:none}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:stretch;gap:8px;pointer-events:none}
.bottom>*{pointer-events:auto}
#endturn{align-self:flex-end;min-height:52px;padding:0 22px;border-radius:26px;font-family:var(--display);font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#panel{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;max-height:34vh;overflow-y:auto;max-width:620px;width:100%;box-sizing:border-box;align-self:center}
.ph{display:flex;align-items:center;gap:10px}
.ph img{width:34px;height:20px;border-radius:2px}
.ph h3{font-size:19px;line-height:1.1}
.ph .sub{font-size:13px;color:var(--muted)}
.yields{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.yields span{display:flex;align-items:center;gap:3px}
.yields svg{width:13px;height:13px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.unitrow{display:flex;flex-wrap:wrap;gap:6px}
.u{padding:4px 8px;border-radius:6px;background:var(--well);font-size:13px;font-weight:700}
.hint{color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>div{height:100%;background:var(--brass)}
.toolbanner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 54px);background:rgba(212,169,79,.92);color:#1d1406;font-weight:800;padding:8px 14px;border-radius:999px;display:flex;gap:10px;align-items:center;font-size:14px;max-width:calc(100% - 140px)}
.toolbanner button{font-weight:800;text-decoration:underline}

/* ---------- sheet / modal / toast ---------- */
#sheetwrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:640px;max-height:78vh;background:var(--glass2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.sh-h h2{font-size:22px;flex:1}
.sh-x{width:40px;height:40px;border-radius:50%;background:var(--well);font-size:20px}
.sh-b{overflow-y:auto;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--well);border:1px solid var(--line2)}
.item .grow{flex:1;min-width:0}
.item h4{margin:0;font-size:16px}
.item p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.item.on{border-color:var(--brass)}
.item.done{opacity:.6}
.item img{width:40px;height:24px;border-radius:3px;flex:0 0 auto}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-right:4px}
.pill.war{background:rgba(224,97,79,.2);color:#ffb2a6}
.pill.ally{background:rgba(124,194,137,.2);color:#b6ecbf}
.pill.trade{background:rgba(143,198,220,.2);color:#c4e6f3}
.pill.truce{background:rgba(255,255,255,.1);color:var(--muted)}
.cost{font-size:12px;color:var(--brass-hi);font-weight:700;white-space:nowrap}
table.rank{width:100%;border-collapse:collapse;font-size:14px}
table.rank th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;padding:4px}
table.rank th:first-child,table.rank td:first-child{text-align:left}
table.rank td{padding:6px 4px;text-align:right;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
#modalwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:0 16px}
#modal{background:var(--glass2);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.6);animation:up .2s ease-out}
#modal h2{font-size:22px;color:var(--brass-hi)}
#modal .acts .btn{flex:1}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:25;pointer-events:none;width:min(420px,calc(100% - 130px))}
.toast{background:rgba(12,19,22,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;animation:up .2s ease-out;text-align:center}
.toast.war{border-color:rgba(224,97,79,.7)}
.toast.good{border-color:rgba(124,194,137,.7)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:50;font-family:var(--display);font-size:22px;color:var(--brass-hi)}
@media (prefers-reduced-motion:reduce){#sheet,#modal,.toast{animation:none}}
</style>

<canvas id="gl"></canvas>
<div id="loading">Gathering the flocks…</div>

const FLAGPAT=[['solid','Plain'],['hstripe','Fess'],['vstripe','Pale'],['diag','Bend'],['cross','Cross'],['quarter','Quartered'],['chevron','Chevron'],['border','Bordure']];

function drawFlag(x,w,h,f){
  x.save();x.fillStyle=f.c1;x.fillRect(0,0,w,h);x.fillStyle=f.c2;
  switch(f.pat){
    case'hstripe':x.fillRect(0,h/3,w,h/3);break;
    case'vstripe':x.fillRect(w/3,0,w/3,h);break;
    case'diag':x.beginPath();x.moveTo(0,h);x.lineTo(w,0);x.lineTo(w,h);x.fill();break;
    case'cross':x.fillRect(w*.3,0,w*.14,h);x.fillRect(0,h*.42,w,h*.16);break;
    case'quarter':x.fillRect(0,0,w/2,h/2);x.fillRect(w/2,h/2,w/2,h/2);break;
    case'chevron':x.beginPath();x.moveTo(0,0);x.lineTo(w*.45,h/2);x.lineTo(0,h);x.fill();break;
    case'border':x.fillRect(0,0,w,h);x.fillStyle=f.c1;x.fillRect(w*.08,h*.12,w*.84,h*.76);break;
  }
  const cx=f.pat==='chevron'?w*.2:f.pat==='cross'?w*.37:w/2,cy=h/2,s=h*.3;
  x.fillStyle=f.ec;x.strokeStyle=f.ec;x.lineCap='round';
  switch(f.em){
    case'feather':x.translate(cx,cy);x.rotate(-.6);x.beginPath();x.ellipse(0,-s*.1,s*.32,s*.95,0,0,7);x.fill();x.strokeStyle=f.c1;x.lineWidth=s*.07;x.beginPath();x.moveTo(0,s*1.1);x.lineTo(0,-s*.8);x.stroke();break;
    case'wing':x.translate(cx,cy);for(let i=0;i<4;i++){x.save();x.rotate(-.9+i*.32);x.beginPath();x.ellipse(s*.25,-s*.1,s*.95-i*.12,s*.2,0,0,7);x.fill();x.restore()}break;
    case'egg':x.beginPath();x.ellipse(cx,cy+s*.08,s*.62,s*.82,0,0,7);x.fill();break;
    case'star':x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?s*.42:s;x.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}x.fill();break;
    case'sun':x.beginPath();x.arc(cx,cy,s*.5,0,7);x.fill();x.lineWidth=s*.12;for(let i=0;i<12;i++){const a=i/12*Math.PI*2;x.beginPath();x.moveTo(cx+Math.cos(a)*s*.68,cy+Math.sin(a)*s*.68);x.lineTo(cx+Math.cos(a)*s*1.02,cy+Math.sin(a)*s*1.02);x.stroke()}break;
    case'eye':x.beginPath();x.moveTo(cx-s,cy);x.quadraticCurveTo(cx,cy-s*.95,cx+s,cy);x.quadraticCurveTo(cx,cy+s*.95,cx-s,cy);x.fill();x.fillStyle=f.c1;x.beginPath();x.arc(cx,cy,s*.32,0,7);x.fill();break;
  }
  x.restore();
}

function income(n){
  let g=0,f=0,m=0,s=0,mp=0;const id=n.id;let pop=0;
  for(const t of G.tiles){if(t.owner!==id)continue;const T=TER[t.t];
    g+=T.gold||0;f+=T.food||0;m+=T.mat||0;if(t.river){f+=1;g+=.5}
    if(t.city){const c=t.city;pop+=c.pop;g+=2+c.pop*.5;s+=1+c.pop*.3;f+=2;mp+=c.pop*.3+(n.gov==='monarchy'?.5:0);if(c.capital){g+=3;s+=1}if(t.coast)g+=2}
    if(t.b){const B=BLD[t.b];g+=B.y.gold||0;f+=B.y.food||0;m+=B.y.mat||0;s+=B.y.sci||0;g-=B.up||0;
      if(t.b==='farm'&&has(n,'agriculture'))f+=1;if(t.b==='market'&&has(n,'banking'))g+=2;if(t.b==='library'&&has(n,'philosophy'))s+=2}
  }

  let gm=1;if(n.gov==='republic')gm+=.15;if(n.gov==='junta')gm-=.1;if(n.species.trait==='thrifty')gm+=.15;

}

  const capP=has(n,'aqueducts')?12:8,rate=(n.species.trait==='fertile'?1.5:1)*(n.gov==='flock'?1.3:1);
  for(const t of citiesOf(n.id)){const c=t.city;if(n.food>0||inc.food>=0){c.grow+=rate*(t.river?1.25:1)*(t.coast?1.1:1);if(c.grow>=3+c.pop*1.5&&c.pop<capP){c.pop++;c.grow=0;if(n.id===0)logEv(c.name+' grew to '+c.pop+' population','good')}}}

}

  if(arm&&arm!==a&&arm.owner!==id){if(atWar(id,arm.owner))return'attack';if(isAlly(id,arm.owner))return'pass';return null}

function aiDiplo(n,borders){

const W3={};

  const x0=-Mg,z0=-Mg,gw=Math.ceil((maxX+2*Mg)/step)+1,gh=Math.ceil((maxZ+2*Mg)/step)+1;
  for(const t of T){t._bh=tileBaseH(t);t._rg=ROUGH[t.t]||.1;t._c=C(TER[t.t].c).multiplyScalar(t.shade||1);t._mt=t.t==='mountain'?1:t.t==='hills'?.22:0}

    for(let ix=0;ix<gw;ix++){const x=x0+ix*step;let ws=0,h=0,rg=0,m=0,r_=0,g_=0,b_=0;
      for(let r=rr-2;r<=rr+2;r++){const off=.5*(r&1),qq=Math.round(x/SQ3-off);

function animateWorld(dt){

    if(u.shake>0){u.shake-=dt;lx+=Math.sin(t*60)*.05*u.shake}
    const ry=vis.rotation.y,hover=u.sea&&!moving?.06+Math.sin(t*2+vis.id)*.06:0;
    inner.position.set(lx*Math.cos(ry)-lz*Math.sin(ry),hover,lx*Math.sin(ry)+lz*Math.cos(ry));
    const fly=moving||u.sea;

      b.o.position.y=fly?.08+Math.sin(t*3+b.ph)*.04:Math.pow(Math.max(0,Math.sin(t*2.4+b.ph)),12)*.07}

  stepFlocks(t);

}

let busy=false;

  const errs=[],safe=(label,f)=>{try{f()}catch(e){console.error(e);errs.push(label+': '+(e&&e.message||e))}};

    safe('setup',()=>{before=P().gold});
    if(P().alive)safe('your armies',()=>{playerAutoArmies();processEconomy(P())});
    let borders=null;safe('borders',()=>{borders=bordersMap()});if(!borders){borders=new Map();for(const n of G.nations)borders.set(n.id,new Set())}
    for(const n of G.nations.slice()){if(!n.alive||!n.ai)continue;safe(n.name,()=>{if(!G.aiPaused)aiTurn(n,borders)});safe(n.name+' economy',()=>processEconomy(n))}
    safe('world events',()=>worldTurn(borders));
    safe('relations',()=>{for(const k in G.rels){const r=G.rels[k];const [a,b]=k.split('_').map(Number);if(!G.nations[a]||!G.nations[b]||!G.nations[a].alive||!G.nations[b].alive)continue;
      if(r.trade)r.op+=.5;if(r.ally)r.op+=.6;if(!r.war)r.op+=r.op>0?-.3:.3;if(G.nations[a].gov===G.nations[b].gov)r.op+=.2;r.op=clamp(r.op,-100,100)}});
    G.turn++;
    safe('season',()=>{const sn=seasonOf(G.turn);if(sn!==seasonOf(G.turn-1))toast(SEASONS[sn]+', year '+yearOf(G.turn)+(sn===3?': harvests fall by 30%':sn===1?': harvests rise by 20%':sn===2?': harvest season, +15% food':': the snow melts'),sn===3?'war':'good')});
    for(const a of G.armies)safe('army moves',()=>{a.moves=armyMoves(a)});
    safe('map',()=>syncWorld());
    safe('panel',()=>{select(G.sel);uiTop()});
    saveGame(true);
    safe('summary',()=>{const d=P().gold-before;toast(`Turn ${G.turn} · ${d>=0?'+':''}${Math.round(d)} gold`,'')});
  }catch(e){console.error(e);errs.push(e&&e.message||String(e))}
  finally{busy=false;$('#endturn').disabled=false}
  if(errs.length)toast('A problem was skipped this turn ('+errs[0].slice(0,80)+'). Your game kept going.','war');
  try{checkEnd();showPending()}catch(e){console.error(e)}
}

function shortBy(me,c,k){const miss=[];if(me.gold<c.g*k)miss.push(Math.ceil(c.g*k-me.gold)+' gold');if(me.mat<c.m*k)miss.push(Math.ceil(c.m*k-me.mat)+' materials');if(me.mp<c.mp*k)miss.push(Math.ceil(c.mp*k-me.mp)+' manpower');return miss.length?`<p style="color:#ffb2a6">For +${k} you need ${miss.join(' and ')} more</p>`:''}
function warStatus(id){const r=rel(0,id),dur=G.turn-r.since,sc=(r.sc&&r.sc[id])||citiesOf(id).length,lostC=Math.max(0,sc-citiesOf(id).length),capTaken=!!r['cap'+id];
  const et=G.tiles.filter(t=>t.owner===id);let near=0;for(const a of armiesOf(0)){const at=G.tiles[a.tile];if(et.some(t=>hexDist(t,at)<=3))near+=armyPow(a)}
  const needC=Math.max(0,Math.ceil(sc/2)-lostC);return {dur,sc,lostC,capTaken,near,ratio:(strength(id)+1)/(near+1),okTime:dur>=3,okPart:lostC>=1||capTaken,okFull:capTaken||needC===0,needC}}
function relPills(r){return (r.war?'<span class="pill war">War</span>':'')+(r.war&&r.offer&&G.turn-r.offer.t<=4?'<span class="pill ally">Offers peace</span>':'')+(!r.ally&&r.allyOffer&&G.turn-r.allyOffer<=4?'<span class="pill ally">Wants alliance</span>':'')+(!r.trade&&r.tradeOffer&&G.turn-r.tradeOffer<=4?'<span class="pill trade">Wants trade</span>':'')+(r.ally?'<span class="pill ally">Allied</span>':'')+(r.trade?'<span class="pill trade">Trade</span>':'')+(!r.war&&G.turn<r.truce?`<span class="pill truce">Truce ${r.truce-G.turn}t</span>`:'')+(!r.war&&!r.ally&&!r.trade?'<span class="pill truce">Neutral</span>':'')}
function renderNatDetail(id){

  <div class="item"><img src="${n._flagURL}" alt="" style="width:80px;height:48px"><div class="grow"><h4>${GOV[n.gov].t} ${esc(n.name)}</h4><p>Stability ${Math.round(stabOf(n))}${stabOf(n)<25?' (unrest, cities may revolt)':''} · ${esc(n.species.name)} · ${TRAIT[n.species.trait].n}${cap?' · Capital '+esc(cap.city.name):''}</p><div style="margin-top:4px">${relPills(r)}</div></div></div>

function doDiplo(kind,id){
  const n=G.nations[id],r=rel(0,id),me=P();
  if(kind==='war'){declareWar(0,id);toast('You declared war on '+n.name,'war')}
  else if(kind==='peace'){if(G.turn-r.ask<1){toast(n.name+' will not hear another envoy this turn','');return}r.ask=G.turn;
    const off=r.offer&&G.turn-r.offer.t<=4;if(off||aiWillPeace(n,me)){const so=strength(id)+1,sm=strength(0)+1;const tribute=off?r.offer.tribute:so<sm*.45?{from:id,to:0,amt:40+Math.floor(rnd()*40)}:null;r.offer=null;makePeace(0,id,tribute);toast('Peace signed with '+n.name+(tribute?` (+${tribute.amt} gold tribute)`:''),'good')}
    else toast(n.name+' refuses peace','war')}
  else if(kind==='ally'){if((r.allyOffer&&G.turn-r.allyOffer<=4)||aiWillAlly(n,me)){r.ally=1;logEv('Alliance formed with '+n.name,'good');toast('Alliance formed with '+n.name,'good')}else{r.op-=2;toast(n.name+' declines an alliance','')}}
  else if(kind==='unally'){r.ally=0;r.op-=15;toast('Alliance with '+n.name+' ended','')}
  else if(kind==='trade'){if((r.tradeOffer&&G.turn-r.tradeOffer<=4)||aiWillTrade(n,me)){r.trade=1;logEv('Trade deal with '+n.name,'good');toast('Trade agreement signed','good')}else{r.op-=1;toast(n.name+' declines to trade','')}}
  else if(kind==='untrade'){r.trade=0;r.op-=8;toast('Trade with '+n.name+' cancelled','')}
  else if(kind==='surrender'){if(r.ask===G.turn){toast(n.name+' already answered this turn','');return}r.ask=G.turn;
    const name=n.name,ws=warStatus(id),ratio=ws.ratio,full=easyFor(0)?.35:.25,part=full*2;
    if(ws.okTime&&ws.okFull&&ratio<full){eliminate(n,0);logEv(name+' surrendered and was annexed','good');toast(name+' surrendered! Their whole nation is yours.','good')}
    else if(ws.okTime&&ws.okPart&&ratio<part){const mine=G.tiles.filter(t=>t.owner===0);const ced=G.tiles.filter(t=>t.owner===id&&!(t.city&&t.city.capital)&&mine.some(m=>hexDist(m,t)<=2));ced.forEach(t=>{if(n.alive){if(t.army&&t.army.owner===id)removeArmy(t.army);setOwner(t,0,true)}});if(n.alive)makePeace(0,id);logEv(name+' ceded '+ced.length+' tiles for peace','good');toast(name+' ceded '+ced.length+' tiles to end the war','good')}
    else{const why=[];if(!ws.okTime)why.push(`Keep fighting ${3-ws.dur} more turn${3-ws.dur===1?'':'s'}.`);
      if(!ws.okPart)why.push('Capture at least one of their cities to make them give up land.');
      if(!ws.okFull)why.push(`Take their capital, or ${ws.needC} more cit${ws.needC===1?'y':'ies'}, to make them give up everything.`);
      if(ws.near===0)why.push(`Move your armies within 3 tiles of their land. Only troops close to them count.`);else if(ratio>=part)why.push(`Bring more troops within 3 tiles of their land. Their army is ${Math.round(ratio*100)}% the size of your nearby troops; it must be under ${Math.round(part*100)}% for land and ${Math.round(full*100)}% for full surrender.`);
      else if(ratio>=full)why.push(`For full surrender their army must be under ${Math.round(full*100)}% of your nearby troops (now ${Math.round(ratio*100)}%).`);
      closeSheet();modal(`<h2>${esc(name)} refuses</h2><p class="muted" style="margin:0">To force a surrender:</p><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">${why.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><div class="acts"><button class="btn primary" data-act="modalclose">Back to the war</button></div>`);return}}
  else if(kind==='gift'){me.gold-=50;n.gold+=50;r.op+=12;toast(n.name+' appreciates your gift (+12 opinion)','good')}
  syncWorld();uiTop();uiPanel();renderNatDetail(id);checkEnd();
}
function sandboxApply(i){
  const t=G.tiles[i],id=G.toolNation;
  if(G.tool==='paint'){if(t.t==='ocean')return;if(id>=0&&!G.nations[id].alive)return;
    if(t.army&&t.army.owner!==id&&id>=0&&!atWar(id,t.army.owner)&&t.army.owner!==id)removeArmy(t.army);
    if(t.city&&id<0)t.city=null;if(t.city&&id>=0){t.city.orig=id;t.city.held=G.turn}
    const prev=t.owner;setOwner(t,id);if(t.city&&id>=0&&prev!==id&&!capitalOf(G.nations[id]))t.city.capital=true}
  else if(G.tool==='army'){if(!passable(t)||t.army||id<0)return;if(t.owner>=0&&t.owner!==id&&!atWar(id,t.owner)){toast('Spawn in '+G.nations[id].name+"'s own land, or declare war on "+G.nations[t.owner].name+' first','war');return}const sa=spawnArmy(id,i,{hawk:4,owl:3,sparrow:3},1);if(sa)sa.free=true}
  else if(G.tool==='found'){if(!passable(t)||t.owner>=0||t.army){toast('Pick open, unclaimed land','');return}if(G.tiles.some(u=>u.city&&hexDist(u,t)<3)){toast('Too close to another city','');return}
    const used=G.nations.map(n=>n.color),color=NATCOLORS.find(c=>!used.includes(c))||pick(NATCOLORS);
    const n=newNation({name:natName(),cap:capName(),gov:pick(Object.keys(GOV)),flag:randomFlag(color),color,species:randomSpecies(),ai:true});placeNation(n,t);aiPickTech(n);logEv(n.name+' rose from the wilds','good');toast(n.name+' has been founded','good');G.tool='none'}
  syncWorld();uiTop();uiPanel();checkEnd();
}

/* ---------- action dispatcher ---------- */
const ACT={
  new(){NS.name=null;openCreator('new',randomSpecies())},
  quick(){const sp=randomSpecies(),color=pick(NATCOLORS);startGame(sp,{name:natName(),cap:capName(),gov:pick(Object.keys(GOV)),flag:randomFlag(color),motto:'Wings over all',settings:{size:'medium',continents:'continents',rivals:9,aggr:'balanced',gold:'modest'}})},
  continue(){const s=readSave();if(s)try{loadGame(s)}catch(e){console.error(e);toast('That save could not be loaded','war')}},
  'cr-tab'(d){CR.tab=d.k;renderCreator()},
  'cr-set'(d){CR.sp[d.k]=d.v;renderCreator();crRebuild()},
  'cr-match'(d){delete CR.sp[d.k];renderCreator();crRebuild()},
  'cr-random'(){const tr=CR.sp.trait;CR.sp=randomSpecies();if(CR.mode==='edit')CR.sp.trait=tr;$('#cr-name').value=CR.sp.name;renderCreator();crRebuild()},
  'cr-next'(){CR.sp.name=($('#cr-name').value.trim()||CR.sp.name).slice(0,28);
    if(CR.mode==='edit'){const n=P();n.species=Object.assign({},CR.sp);n._tpl=null;for(const v of W3.armyVis.values())v.userData.key='';const p=W3.patrol.get(0);if(p){W3.sky.remove(p);W3.patrol.delete(0)}active='world';show('hud');syncWorld();uiTop();onResize();toast('Species updated','good')}
    else openNation('new')},
  'ns-set'(d){readNationInputs();NS[d.k]=d.v;renderNation()},
  'ns-flag'(d){readNationInputs();NS.flag[d.k]=d.v;renderNation()},
  'ns-randflag'(){readNationInputs();NS.flag=randomFlag(pick(NATCOLORS));renderNation()},
  'ns-world'(d){readNationInputs();NS.settings[d.k]=d.k==='rivals'?+d.v:d.v;renderNation()},
  'ns-back'(){if(NS.mode==='edit'){active='world';show('hud');onResize()}else{readNationInputs();openCreator('new',CR.sp)}},
  'ns-go'(){readNationInputs();
    if(NS.mode==='edit'){const n=P();n.name=NS.name;n.motto=NS.motto;n.gov=NS.gov;n.flag=Object.assign({},NS.flag);n.color=NS.flag.c1;n._col=null;n._flagURL=null;nationArt(n);n._tpl=null;
      const cap=capitalOf(n);if(cap)cap.city.name=NS.cap;for(const t of G.tiles)if(t.owner===0)t._dk=null;for(const v of W3.armyVis.values())v.userData.key='';const p=W3.patrol.get(0);if(p){W3.sky.remove(p);W3.patrol.delete(0)}
      active='world';show('hud');syncWorld();uiTop();uiPanel();onResize();toast('Nation updated','good')}
    else{$('#loading').hidden=false;setTimeout(()=>{startGame(Object.assign({},CR.sp),JSON.parse(JSON.stringify(NS)));$('#loading').hidden=true},30)}},
  endturn(){endTurn()},
  sheet(d){if(d.s==='diplo'){openSheet('diplo',null)}else openSheet(d.s)},
  closesheet(){closeSheet()},
  natdetail(d){openSheet('diplo',+d.id)},
  build(d){const t=G.tiles[G.sel];doBuild(P(),t,d.b);closeSheet();syncWorld();uiTop();uiPanel()},
  demolish(){const t=G.tiles[G.sel];t.b=null;syncWorld();uiPanel();uiTop()},
  foundcity(){const t=G.tiles[G.sel];foundCity(P(),t);toast('Founded '+t.city.name,'good');syncWorld();uiTop();uiPanel()},
  claim(){const t=G.tiles[G.sel];claim(P(),t);syncWorld();uiTop();uiPanel()},
  recruit(d){const t=G.tiles[G.sel];if(recruit(P(),t,d.u,+d.c)){syncWorld();uiTop();select(G.sel);renderSheet()}},
  disband(){const t=G.tiles[G.sel];if(t.army){removeArmy(t.army);syncWorld();select(G.sel);uiTop()}},
  renamecity(){G.renaming=G.sel;uiPanel();const i=$('#rename-in');if(i)i.focus()},
  renameok(){const t=G.tiles[G.sel],v=$('#rename-in').value.trim();if(v)t.city.name=v.slice(0,18);if(t.city.capital&&t.owner===0)P().cap=t.city.name;G.renaming=null;syncWorld();uiPanel()},
  research(d){P().res=d.t;renderSheet();uiTop()},
  dip(d){doDiplo(d.k,+d.id)},
  locate(d){closeSheet();const t=G.tiles[+d.i];flyTo(t);select(t.i)},
  setgov(d){const me=P();if(me.gold<100)return;me.gold-=100;me.gov=d.g;me.govT=G.turn;logEv('Your nation became a '+GOV[d.g].n,'good');renderSheet();uiTop()},
  editspecies(){closeSheet();openCreator('edit',P().species)},
  editnation(){closeSheet();openNation('edit')},
  tool(d){G.tool=G.tool===d.t?'none':d.t;if(G.toolNation>=0&&!G.nations[G.toolNation].alive)G.toolNation=0;closeSheet();select(null);uiTop()},
  'tool-off'(){G.tool='none';uiTop()},
  autoarmy(){const a=G.tiles[G.sel].army;if(!a)return;a.auto=!a.auto;if(a.auto){if(!alive().some(n=>atWar(0,n.id)))toast('Auto-attack is on. It starts once you are at war.','');else{playerAutoArmies(a);toast('Army advancing on the enemy','good')}}afterAction(G.armies.includes(a)?a:null)},
  allattack(d){for(const a of armiesOf(0))a.auto=true;const n=playerAutoArmies();closeSheet();afterAction(null);toast(n?'All armies are attacking. They keep advancing every turn.':'Armies set to auto-attack. They advance every turn.','good')},
  eventstog(){G.events=G.events===false;renderSheet()},
  festival(){const me=P(),c=festCost(me);if(me.gold<c||hasFx(me,'festival'))return;me.gold-=c;addFx(me,{k:'festival',n:'Festival',t:4,stab:15});me.stab=Math.min(100,stabOf(me)+5);toast('The flock celebrates! Stability is rising.','good');renderSheet();uiTop()},
  martial(){const me=P();if(hasFx(me,'martial'))return;addFx(me,{k:'martial',n:'Martial law',t:5,stab:12,gold:.75,sci:.75});me.stab=Math.min(100,stabOf(me)+5);toast('Martial law declared for 5 turns','');renderSheet();uiTop()},
  'evt-choice'(d){const e=G._evt;G._evt=null;if(!e){closeModal();return}const E=EVT[e.ev],eff=E.run(P(),+d.c,e.d);logEv(E.title+': '+eff,E.good?'good':'');closeModal();toast(eff,'');syncWorld();uiTop();uiPanel()},
  freecity(){const t=G.tiles[G.sel];if(!t.city||t.city.capital||t.owner!==0)return;modal(`<h2>Free ${esc(t.city.name)}?</h2><p style="margin:0">The city and the land around it become a new independent nation and your ally. Your flock approves: +8 stability for 8 turns.</p><div class="acts"><button class="btn" data-act="modalclose">Keep it</button><button class="btn primary" data-act="freecityok">Grant independence</button></div>`)},
  freecityok(){const t=G.tiles[G.sel];closeModal();if(!t.city||t.city.capital||t.owner!==0)return;grantIndependence(t);syncWorld();select(G.sel);uiTop()},
  easywar(){G.easyWar=G.easyWar===false;renderSheet();select(G.sel)},
  redeploy(){const t=G.tiles[G.sel];if(t.army&&t.army.owner===0)startRedeploy(t.army)},
  'redeploy-off'(){const a=G.redeploy;G.redeploy=null;select(a&&G.armies.includes(a)?a.tile:G.sel);uiTop()},
  split(){const a=G.tiles[G.sel].army;if(!a)return;if(freeTileNear(a.tile)<0){toast('No free tile in your nation next to this army to split onto','war');return}
    modal(`<h2>Split army</h2><p class="muted" style="margin:0">Choose how many birds form the new army. It appears on the nearest free tile in your nation.</p>${UORDER.filter(k=>a.units[k]>0).map(k=>`<div class="ctl"><label for="sp-${k}">${UNIT[k].n}<span class="num" id="spl-${k}">${Math.floor(a.units[k]/2)} of ${a.units[k]}</span></label><input type="range" id="sp-${k}" data-split="${k}" min="0" max="${a.units[k]}" step="1" value="${Math.floor(a.units[k]/2)}"></div>`).join('')}<div class="acts"><button class="btn" data-act="modalclose">Cancel</button><button class="btn primary" data-act="splitok">Split</button></div>`)},
  splitok(){const a=G.tiles[G.sel].army;if(!a){closeModal();return}const take={};let n=0;for(const k of UORDER){const el=$('#sp-'+k);if(el){const v=Math.min(+el.value,a.units[k]);if(v>0){take[k]=v;n+=v}}}
    if(!n){toast('Pick at least one bird for the new army','');return}if(n>=total(a)){toast('Leave at least one bird in the old army','');return}
    const ti=freeTileNear(a.tile);if(ti<0){closeModal();return}for(const k in take)a.units[k]-=take[k];const na=spawnArmy(0,ti,take,0);na.moves=a.moves;na.free=a.free;closeModal();syncWorld();select(a.tile);uiTop();toast('Army split','good')},
  toolnat(d){G.toolNation=+d.id;renderSheet();uiTop()},
  sb(d){const me=P();
    if(d.k==='gold')me.gold+=500;else if(d.k==='sci')me.resP+=100;else if(d.k==='mat')me.mat+=100;else if(d.k==='mp')me.mp+=50;
    else if(d.k==='tech')me.tech=Object.keys(TECH);
    else if(d.k==='peace'){for(const a of alive())for(const b of alive())if(a.id<b.id&&rel(a.id,b.id).war)makePeace(a.id,b.id);toast('Peace settles over the world','good')}
    else if(d.k==='war'){const ais=alive().filter(n=>n.ai);if(ais.length>=2){const a=pick(ais);const b=pick(ais.filter(x=>x!==a));declareWar(a.id,b.id,true);toast(a.name+' declared war on '+b.name,'war')}}
    else if(d.k==='revolt'){const c=G.tiles.filter(t=>t.city&&!t.city.capital&&t.owner>0);if(c.length){const t=pick(c),own=G.nations[t.owner],nm=t.city.name,rb=doRevolt(own,t,true);toast(rb?`${nm} rose against ${own.name}, now ${rb.name}`:`Riots in ${nm} were crushed`,'war')}else toast('No rival city can revolt right now','')}
    else if(d.k==='event'){closeSheet();const b=bordersMap();rollEvent(me,b);if(!G.pending.length)toast('Nothing happened this time. Try again.','');showPending();return}
    else if(d.k==='ai'){G.aiPaused=!G.aiPaused}
    syncWorld();renderSheet();uiTop();uiPanel()},
  doattack(d){closeModal();const a=G.selArmy;if(!a||!G.reach)return;const na=moveArmyTo(a,+d.d,G.reach);afterAction(na)},
  modalclose(){closeModal()},
  'evt-ok'(){G._evt=null;closeModal()},
  'evt-yes'(){const e=G._evt;G._evt=null;const r=rel(0,e.from);
    if(e.kind==='peace'){makePeace(0,e.from,e.tribute);toast('Peace signed'+(e.tribute?` (+${e.tribute.amt} gold)`:''),'good')}
    else if(e.kind==='ally'){r.ally=1;logEv('Alliance formed with '+G.nations[e.from].name,'good')}
    else if(e.kind==='trade'){r.trade=1;logEv('Trade deal with '+G.nations[e.from].name,'good')}
    syncWorld();uiTop();uiPanel();closeModal()},
  'evt-never'(){const e=G._evt;G._evt=null;if(e){rel(0,e.from).noPeace=1;G.pending=G.pending.filter(x=>!(x.kind==='peace'&&x.from===e.from));toast(G.nations[e.from].name+' will not ask for peace again this war','')}closeModal()},
  'evt-blockall'(){G._evt=null;G.noPeaceAll=true;G.pending=G.pending.filter(x=>x.kind!=='peace');toast('Peace offers blocked. Turn them back on in the Menu.','');closeModal()},
  popuptog(){const o=['all','important','none'];G.popups=o[(o.indexOf(G.popups||'important')+1)%3];renderSheet();toast({all:'Every message pops up',important:'Only wars and choices pop up. Everything else is a short message.',none:'No pop-ups. Choices are skipped automatically.'}[G.popups],'')},
  peacetog(){G.noPeaceAll=!G.noPeaceAll;renderSheet()},
  'evt-no'(){const e=G._evt;G._evt=null;if(e&&e.kind!=='peace')rel(0,e.from).op-=5;closeModal()},
  sell(d){const me=P();if(d.r==='mat'&&me.mat>=100){me.mat-=100;me.gold+=50}else if(d.r==='food'&&me.food>=100){me.food-=100;me.gold+=30}renderSheet();uiTop();uiPanel()},
  trees(){const on=!treesOn();W3.treesOn=on;try{localStorage.setItem('birdEmpires.trees',on?'on':'off')}catch(e){}applyTrees();renderRail();if(SHEET&&SHEET.kind==='menu')renderSheet();toast(on?'Forests shown':'Forests hidden','')},
  save(){saveGame()},
  quality(){QUALITY=QUALITY==='high'?'low':'high';try{localStorage.setItem('birdEmpires.q',QUALITY)}catch(e){}applyQuality();if(G&&sceneW){buildWorldScene(true);select(G.sel)}renderSheet()},
  quit(){closeModal();closeSheet();if(G)saveGame(true);goTitle()},
  spectate(){closeModal();G.tool='none'}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset)}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(SCREEN==='creator'&&el.dataset.k){if(el.type==='range'){CR.sp[el.dataset.k]=+el.value;const l=el.previousElementSibling&&el.previousElementSibling.querySelector('span');if(l)l.textContent=Math.round(el.value*100)+'%'}else CR.sp[el.dataset.k]=el.value;crRebuild()}
  if(el.dataset.split){const k=el.dataset.split,l=$('#spl-'+k);if(l)l.textContent=el.value+' of '+el.max}
  if(SCREEN==='nation'&&el.dataset.flagk){readNationInputs();NS.flag[el.dataset.flagk]=el.value;drawFlag($('#flagbig').getContext('2d'),500,300,NS.flag)}
});
document.addEventListener('change',e=>{if(SCREEN==='creator'&&e.target.type==='color')renderCreator();if(SCREEN==='nation'&&e.target.dataset.flagk)renderNation()});
$('#sheetwrap').addEventListener('click',e=>{if(e.target.id==='sheetwrap')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modalwrap').hidden&&!(G&&G._evt))closeModal();else closeSheet()}if(e.key==='Enter'&&SCREEN==='hud'&&e.target.id==='rename-in')ACT.renameok()});

/* =========================================================
   boot
   ========================================================= */
function applyQuality(){
  if(!renderer)return;renderer.setPixelRatio(Math.min(devicePixelRatio,QUALITY==='high'?2:1.25));
  renderer.shadowMap.enabled=QUALITY==='high';if(W3.sun)W3.sun.castShadow=QUALITY==='high';
  if(sceneW)sceneW.traverse(o=>{if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.needsUpdate=true)}});
  onResize();
}
function onResize(){
  if(!renderer)return;const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);
  camW.aspect=w/h;camW.updateProjectionMatrix();camC.aspect=w/h;
  const panel=$('#cr-panel');let off=0;if(SCREEN==='creator'&&panel)off=panel.offsetHeight*.42;
  else if(SCREEN==='title')off=h*.2;
  if(off)camC.setViewOffset(w,h,0,off,w,h);else camC.clearViewOffset();
  camC.position.set(0,1.5,clamp(3.4/(w/h),5.2,9));camC.lookAt(0,.8,0);camC.updateProjectionMatrix();
}
function goTitle(){
  active='creator';show('title');$('#btn-continue').hidden=!readSave();
  setCreatorBird(randomSpecies());crYawV=.35;onResize();
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);if(document.hidden)return;const dt=Math.min(.05,(now-last)/1000);last=now;
  try{
    if(active==='creator'){animateCreator(dt);renderer.render(sceneC,camC)}
    else if(active==='world'&&sceneW){animateWorld(dt);renderer.render(sceneW,camW)}
  }catch(e){console.error(e)}
}
function boot(data){
  try{QUALITY=localStorage.getItem('birdEmpires.q')||'high'}catch(e){}
  if(!window.THREE){$('#loading').textContent='Could not load the 3D engine. Check your connection and reload.';return}
  try{renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,powerPreference:'high-performance'})}catch(e){$('#loading').textContent='This device does not support WebGL, which Bird Empires needs.';return}
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  BAKED_SMOOTH=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.78});BAKED_FLAT=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,flatShading:true});
  camC=new THREE.PerspectiveCamera(32,1,.1,100);camW=new THREE.PerspectiveCamera(42,1,.1,400);
  buildCreatorScene();setupInput();applyQuality();addEventListener('resize',onResize);
  requestAnimationFrame(frame);
  const go=()=>{$('#loading').hidden=true;if(data&&data.save){try{loadGame(data.save);return}catch(e){console.error(e)}}goTitle()};
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go,go);
}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>G&&SCREEN==='hud'?{save:serialize()}:{})}catch(e){}
window.claude&&window.claude.hot&&window.claude.hot.ready?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
